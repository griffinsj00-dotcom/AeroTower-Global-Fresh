
name: Build AeroTower APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AeroTower-Global-FRESH-Android-Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract AeroTower project
        run: |
          unzip -q AeroTower-Global-FRESH-Android-Project.zip -d extracted

      - name: Build Android APK
        run: |
          gradle -p extracted/AeroTower-Global-Android assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AeroTower-Global-APK
          path: extracted/AeroTower-Global-Android/app/build/outputs/apk/debug/app-debug.apk
